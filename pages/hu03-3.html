<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fatura disponível — Bulbe</title>

  <!-- Login: sem sessão, vai para pages/login.html (assets/js/sessao.js) -->
  <script src="../assets/js/sessao.js"></script>

  <!-- Shell do app (mesmo do index.html) + estilo próprio da tela -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/rodape.css">
  <link rel="stylesheet" href="../assets/css/navegacao.css">
  <link rel="stylesheet" href="../assets/css/hu03-3.css">
</head>
<body>
  <div class="app">

    <!-- Cabeçalho padrão do projeto -->
    <header class="cabecalho">
      <img class="imagem-cabecalho" src="../assets/img/header.svg" alt="Bulbe - Menu, notificações e perfil">
    </header>

    <main class="conteudo">
      <div class="hf-pilha">

        <!-- Título com voltar (mesmo padrão das telas internas da HU04) -->
        <div class="titulo-pagina">
          <a href="hu03-2.html" class="hbtn" aria-label="Voltar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </a>
          <h1>Fatura disponível</h1>
        </div>

        <!-- Aviso de sucesso (branco sobre o azul) -->
        <div class="hf-success-banner">
          <div class="hf-success-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <h2>Sua primeira fatura chegou!</h2>
          <p>Pague até 28 nov para evitar juros e manter o serviço em dia.</p>
        </div>

        <div class="hf-card">
          <div class="hf-row-baseline">
            <div>
              <div class="hf-card-title">Janeiro/26</div>
              <div class="hf-label">Vence dia <strong class="hf-text-strong">28 de novembro</strong></div>
            </div>
            <span class="hf-pill">Em aberto</span>
          </div>

          <div class="hf-row-end">
            <div class="hf-preco">
              <span class="hf-label">R$</span>
              <span class="hf-price">—,—</span>
            </div>
            <span class="hf-pill hf-pill--neutro">— kWh</span>
          </div>

          <div class="hf-discount-bar">
            Desconto Bulbe: <strong>a calcular</strong>
          </div>

          <div class="hf-barcode">
            <span class="hf-barcode-label">código de barras / Pix</span>
          </div>
        </div>

        <!-- Ação principal em destaque; ações secundárias em linha -->
        <div class="hf-acoes">
          <a href="hu03-4.html" class="hf-btn hf-btn--primary">Pagar agora</a>
          <div class="hf-btn-grid">
            <button class="hf-btn" type="button">Ver fatura</button>
            <button class="hf-btn" type="button">Baixar PDF</button>
            <button class="hf-btn" type="button">Copiar código</button>
          </div>
        </div>

        <a href="#" class="hf-link-center">Ver histórico de faturas</a>

      </div>
    </main>

    <!-- Navegação inferior: mesmo rodapé de todas as telas -->
    <nav class="rodape" aria-label="Navegação principal"></nav>
  </div>

  <script src="../assets/js/rodape.js"></script>
  <script src="../assets/js/navegacao.js"></script>
</body>
</html>
